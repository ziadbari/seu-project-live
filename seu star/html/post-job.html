<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job Circular | SEU Career Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: #000000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .post-container { max-width: 800px; margin: 100px auto 50px auto; padding: 20px; }
        .page-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; background: linear-gradient(180deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .page-subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 30px; }

        .form-card { background: rgba(18, 26, 41, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(14px); padding: 30px; border-radius: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: #0a0f19; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 14px; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #0066ff; box-shadow: 0 0 10px rgba(0, 102, 255, 0.3); }

        .submit-btn { background: #0066ff; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background: #0052cc; box-shadow: 0 0 15px rgba(0, 102, 255, 0.5); }

        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container flex-nav">
            <a href="index.html" class="logo-container">
                <img src="../images/download.jpg" alt="SEU Logo" class="varsity-logo">
                <div class="logo-text">
                    <h2>SOUTHEAST <span>UNIVERSITY</span></h2>
                    <small>Career Connect System</small>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Find Jobs</a></li>
                    <li><a href="alumni.html">Alumni</a></li>
                    <li><a href="alumni-events.html">Alumni Events</a></li>
                    <li><a href="post-job.html" class="active">Post Job</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="post-container">
        <h1 class="page-title">Post a Job or Internship</h1>
        <p class="page-subtitle">Are you working in a company? Share job circulars to hire talented Southeast University juniors.</p>

        <div class="form-card">
            <form id="jobPostForm" onsubmit="handleJobPost(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" id="jobTitle" placeholder="e.g. Junior Software Engineer" required>
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="companyName" placeholder="e.g. Brain Station 23 / bKash" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Job Category</label>
                        <select id="jobCategory" required>
                            <option value="">Select Category</option>
                            <option value="software">Software Engineering</option>
                            <option value="sqa">SQA & Testing</option>
                            <option value="data">Data & Analytics</option>
                            <option value="network">Network & Security</option>
                            <option value="management">Management & Product</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Job Location</label>
                        <select id="jobLocation" required>
                            <option value="">Select Location</option>
                            <option value="Dhaka (On-site)">Dhaka (On-site)</option>
                            <option value="Remote / Hybrid">Remote / Hybrid</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Salary Range</label>
                        <input type="text" id="jobSalary" placeholder="e.g. BDT 40,000 - 55,000 / month" required>
                    </div>
                    <div class="form-group">
                        <label>Application Deadline</label>
                        <input type="date" id="jobDeadline" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Job Description & Requirements</label>
                    <textarea id="jobDesc" rows="4" placeholder="Mention tech stack, responsibilities and requirements..." required></textarea>
                </div>

                <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Publish Job Circular</button>
            </form>
        </div>
    </div>

    <script>
        function handleJobPost(e) {
            e.preventDefault();

            const newJob = {
                title: document.getElementById('jobTitle').value,
                company: document.getElementById('companyName').value,
                category: document.getElementById('jobCategory').value,
                location: document.getElementById('jobLocation').value,
                salary: document.getElementById('jobSalary').value,
                deadline: document.getElementById('jobDeadline').value,
                description: document.getElementById('jobDesc').value
            };

            let existingJobs = JSON.parse(localStorage.getItem('seu_custom_jobs')) || [];
            existingJobs.push(newJob);
            localStorage.setItem('seu_custom_jobs', JSON.stringify(existingJobs));

            alert('Job circular successfully published! It is now live on the "Find Jobs" page.');
            window.location.href = 'jobs.html';
        }
    </script>
</body>
</html>
