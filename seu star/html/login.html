<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SEU Career Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
        .auth-card { background: rgba(18, 26, 41, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 5px; }
        .form-group input { width: 100%; background: #0a0f19; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: #fff; outline: none; }
        .auth-btn { width: 100%; background: #0066ff; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; text-align: center; display: none; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #a0aec0; }
        .auth-footer a { color: #0066ff; text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container flex-nav">
            <div class="logo-container">
                <img src="../images/download.jpg" alt="Logo" class="varsity-logo">
                <div class="logo-text"><h2>SOUTHEAST <span>UNIVERSITY</span></h2></div>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Find Jobs</a></li>
                    <li><a href="login.html" class="active">Login</a></li>
                    <li><a href="registration.html">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2 style="color:#fff; margin-bottom:20px; text-align:center;">Portal Login</h2>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Student ID / Email</label>
                    <input type="text" id="username" placeholder="e.g. 2023001" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div id="errorMsg" class="error-msg"></div>
                <button type="submit" class="auth-btn">Login</button>
            </form>

            
            <div class="auth-footer">
                Don't have an account? <a href="registration.html">Register here</a>
            </div>
        </div>
    </section>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('errorMsg');

            // ডেমো সঠিক আইডি ও পাসওয়ার্ড সিনারিও
            if ((user === "2023001" && pass === "12345") || (user === "admin" && pass === "admin123")) {
                window.location.href = "student dashboard.html";
            } else {
                errorBox.style.display = "block";
                errorBox.innerText = "Invalid Student ID or Password! Try again.";
            }
        }
    </script>
</body>
</html>
