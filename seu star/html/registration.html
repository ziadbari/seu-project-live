<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SEU Career Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; padding-top: 80px; }
        .auth-card { background: rgba(18, 26, 41, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 12px; width: 100%; max-width: 420px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; background: #0a0f19; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: #fff; outline: none; }
        .form-group select option { background: #0a0f19; color: #fff; }
        .auth-btn { width: 100%; background: #0066ff; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .auth-footer { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #a0aec0; }
        .auth-footer a { color: #0066ff; text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        
        /* ফর্মের ভেতরে সবুজ রঙের সাকসেস মেসেজ স্টাইল */
        #successMsg {
            color: #10b981;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container flex-nav">
            <div class="logo-container">
                <img src="../images/download.jpg" alt="Logo" class="varsity-logo">
                <div class="logo-text"><h2>SOUTHEAST <span>UNIVERSITY</span></h2></div>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Find Jobs</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="registration.html" class="active">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2 style="color:#fff; margin-bottom:15px; text-align:center;">Create Account</h2>
            
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" placeholder="e.g. 2023001" required>
                </div>
                <div class="form-group">
                    <label>SEU Email</label>
                    <input type="email" placeholder="name@seu.edu.bd" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create password" required>
                </div>
                <button type="submit" class="auth-btn">Register</button>
                
                <!-- এই মেসেজটি ফর্মের ভেতর সবুজ রঙে ভেসে উঠবে -->
                <div id="successMsg">Registration Successful! Redirecting...</div>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </section>

    <script>
        function handleRegister(event) {
            event.preventDefault(); // পেজ রিলোড হওয়া আটকাবে
            
            // সবুজ রঙের মেসেজ বক্সটি দেখাবে
            const msgBox = document.getElementById('successMsg');
            msgBox.style.display = 'block';

            // ২ সেকেন্ড (২০০০ মিলিসেকেন্ড) পর হোমপেজে নিয়ে যাবে
            setTimeout(function() {
                window.location.href = "index.html";
            }, 2000);
        }
    </script>
</body>
</html>
